[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jigsaw-puzzle-reconstruction"
version = "1.0.0"
description = "Reconstructing STL-10 images from shuffled patches with OrderNet, a Sinkhorn assembly layer and a U-Net refiner (Keras 3)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Matin Monshizadeh" }]
keywords = ["deep-learning", "computer-vision", "jigsaw-puzzle", "sinkhorn", "permutation-learning", "keras", "tensorflow", "stl10"]
dependencies = [
  "tensorflow>=2.16",
  "keras>=3.0",
  "numpy>=1.26",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/matinmonshizadeh/jigsaw-puzzle-reconstruction"

[tool.setuptools.packages.find]
where = ["src"]
